<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liczenie leków</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 480px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 10px 0; }
  input { width: 5.5em; font-size: 1.1rem; padding: 8px; text-align: center; border-radius: 8px; border: 1px solid #888; background: transparent; color: inherit; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 16px; min-height: 16em; font: 1.05rem/1.6 ui-monospace, Consolas, monospace; padding: 10px; border-radius: 10px; border: 1px solid #8886; background: transparent; color: inherit; resize: vertical; }
  .note { font-size: .85rem; opacity: .7; margin-top: 14px; }
  .err { color: #c0392b; margin-top: 12px; }
</style>
</head>
<body>
<h1>Liczenie leków</h1>

<label>Godzina startu (0-23)
  <input id="godz" type="number" inputmode="numeric" min="0" max="23" value="8"></label>
<label>Tabletek w 1. dobie
  <input id="t1" type="number" inputmode="numeric" min="1" max="24" value="1"></label>
<label>Tabletek w kolejnych dobach
  <input id="t2" type="number" inputmode="numeric" min="1" max="24" value="1"></label>
<label>Liczba dób leczenia
  <input id="doby" type="number" inputmode="numeric" min="1" max="30" value="3"></label>

<textarea id="wynik" readonly></textarea>
<p class="note">Godziny zaokrąglone do 30 minut. (+1) = następny dzień kalendarzowy, (+2) = kolejny itd. Pierwsza dawka każdej kolejnej doby = ostatnia dawka poprzedniej doby + interwał nowej doby. Narzędzie pomocnicze, nie zastępuje zaleceń lekarza ani ulotki.</p>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

function przelicz() {
  const g = parseInt($("godz").value), t1 = parseInt($("t1").value),
        t2 = parseInt($("t2").value), d = parseInt($("doby").value);
  const out = $("wynik");
  if (!(g >= 0 && g <= 23 && t1 >= 1 && t2 >= 1 && d >= 1 && d <= 30)) {
    out.value = "Wpisz poprawne wartości.";
    return;
  }
  const zaokr = m => 30 * Math.floor(m / 30 + 0.5);   // do pełnych 30 minut
  const fmt = t => {
    const dzien = Math.floor(t / 1440);
    return pad(Math.floor((t % 1440) / 60)) + ":" + pad(t % 60) + (dzien > 0 ? ` (+${dzien})` : "");
  };
  let linie = [];
  let ostatnia = null;                                 // ostatnia dawka poprzedniej doby (min)
  for (let doba = 0; doba < d; doba++) {
    const n = doba === 0 ? t1 : t2;
    const interwal = 1440 / n;                         // minuty
    const pierwsza = doba === 0 ? g * 60 : ostatnia + interwal;
    const dawki = [];
    for (let i = 0; i < n; i++) dawki.push(zaokr(pierwsza + i * interwal));
    ostatnia = dawki[n - 1];
    linie.push(`Doba ${doba + 1} (co ${(24 / n).toFixed(2)} h):\n  ${dawki.map(fmt).join("   ")}`);
  }
  out.value = linie.join("\n\n");
}
["godz", "t1", "t2", "doby"].forEach(id => $(id).addEventListener("input", przelicz));
przelicz();
</script>
</body>
</html>
